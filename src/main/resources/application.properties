# Application
spring.application.name=supermarket-erp
server.port=8080

# MySQL Database connection
# Create the database first:  CREATE DATABASE supermarket_erp;
spring.datasource.url=jdbc:mysql://localhost:3306/supermarket_erp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
