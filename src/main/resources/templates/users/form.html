<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle} + ' - Supermarket ERP'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2 th:text="${formTitle}"></h2>

    <form th:action="@{/users/save}" method="post" class="row g-3 mt-2">
        <input type="hidden" name="id" th:value="${user.id}" />

        <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required />
        </div>
        <div class="col-md-6">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" th:value="${user.username}" required />
        </div>
        <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control"
                   th:placeholder="${user.id != null} ? 'Leave blank to keep current password' : ''"
                   th:required="${user.id == null}" />
        </div>
        <div class="col-md-6">
            <label class="form-label">Role</label>
            <select name="roleId" class="form-select" required>
                <option value="">-- Select Role --</option>
                <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"
                        th:selected="${user.role != null and user.role.id == r.id}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" th:value="${user.email}" required />
        </div>
        <div class="col-md-4">
            <label class="form-label">Contact No</label>
            <input type="text" name="contactNo" class="form-control" th:value="${user.contactNo}" required />
        </div>
        <div class="col-md-2">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">ACTIVE</option>
                <option value="INACTIVE" th:selected="${user.status == 'INACTIVE'}">INACTIVE</option>
            </select>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/users}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
