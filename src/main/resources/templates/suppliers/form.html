<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle} + ' - Supermarket ERP'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2 th:text="${formTitle}"></h2>

    <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post" class="row g-3 mt-2" novalidate>
        <input type="hidden" th:field="*{id}" />

        <div class="col-md-6">
            <label class="form-label">Supplier Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Contact Person</label>
            <input type="text" th:field="*{contactPerson}" class="form-control"
                   th:classappend="${#fields.hasErrors('contactPerson')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-md-12">
            <label class="form-label">Address</label>
            <textarea th:field="*{address}" class="form-control" rows="2"
                      th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/suppliers}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
