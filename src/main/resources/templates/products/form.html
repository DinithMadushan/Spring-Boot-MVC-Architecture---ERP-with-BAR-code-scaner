<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle} + ' - Supermarket ERP'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2 th:text="${formTitle}"></h2>

    <form th:action="@{/products/save}" th:object="${product}" method="post" class="row g-3 mt-2" novalidate>
        <input type="hidden" th:field="*{id}" />

        <div class="col-md-6">
            <label class="form-label">Product Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Barcode</label>
            <input type="text" th:field="*{barcode}" class="form-control"
                   th:classappend="${#fields.hasErrors('barcode')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Category</label>
            <input type="text" th:field="*{category}" class="form-control"
                   th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Brand</label>
            <input type="text" th:field="*{brand}" class="form-control" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Size</label>
            <input type="text" th:field="*{size}" class="form-control" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Color</label>
            <input type="text" th:field="*{color}" class="form-control" />
        </div>

        <div class="col-md-4">
            <label class="form-label">Purchase Price (Rs.)</label>
            <input type="number" step="0.01" th:field="*{purchasePrice}" class="form-control"
                   th:classappend="${#fields.hasErrors('purchasePrice')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('purchasePrice')}" th:errors="*{purchasePrice}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Selling Price (Rs.)</label>
            <input type="number" step="0.01" th:field="*{sellingPrice}" class="form-control"
                   th:classappend="${#fields.hasErrors('sellingPrice')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('sellingPrice')}" th:errors="*{sellingPrice}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
                <option value="ACTIVE">ACTIVE</option>
                <option value="DISCONTINUED">DISCONTINUED</option>
            </select>
        </div>

        <div class="col-12">
            <p class="text-muted small">Stock quantity is managed separately per location under <a th:href="@{/inventory}">Inventory</a> (via Goods Received Notes and Sales).</p>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
