<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle} + ' - Supermarket ERP'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2 th:text="${formTitle}"></h2>

    <form th:action="@{/locations/save}" th:object="${location}" method="post" class="row g-3 mt-2" novalidate>
        <input type="hidden" th:field="*{id}" />

        <div class="col-md-6">
            <label class="form-label">Location Name</label>
            <input type="text" th:field="*{locationName}" class="form-control"
                   th:classappend="${#fields.hasErrors('locationName')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('locationName')}" th:errors="*{locationName}"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control"
                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/locations}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
