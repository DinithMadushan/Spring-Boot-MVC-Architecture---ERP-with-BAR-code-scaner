<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receipt Details - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="'Receipt ' + ${receipt.receiptNumber}"></h2>
        <a th:href="@{/sales}" class="btn btn-secondary btn-sm">Back to list</a>
    </div>

    <div class="row mb-4">
        <div class="col-md-3"><strong>Location:</strong> <span th:text="${receipt.location.locationName}"></span></div>
        <div class="col-md-3"><strong>Cashier:</strong> <span th:text="${receipt.cashier.fullName}"></span></div>
        <div class="col-md-3"><strong>Date:</strong> <span th:text="${receipt.createdAt}"></span></div>
        <div class="col-md-3"><strong>Payment:</strong> <span th:text="${receipt.paymentMethod}"></span></div>
    </div>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${receipt.items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${'Rs. ' + item.unitPrice}"></td>
            <td th:text="${'Rs. ' + item.subtotal}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr><td colspan="3" class="text-end">Subtotal</td><td th:text="${'Rs. ' + receipt.subTotal}"></td></tr>
        <tr><td colspan="3" class="text-end">Discount</td><td th:text="${'Rs. ' + receipt.discount}"></td></tr>
        <tr><td colspan="3" class="text-end"><strong>Total</strong></td><td><strong th:text="${'Rs. ' + receipt.totalAmount}"></strong></td></tr>
        </tfoot>
    </table>
</div>
</body>
</html>
