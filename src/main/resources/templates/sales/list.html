<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sales - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Sales Receipts</h2>
        <a th:href="@{/sales/new}" class="btn btn-success">+ New Sale</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr><th>Receipt #</th><th>Location</th><th>Cashier</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(receipts)}">
            <td colspan="8" class="text-center text-muted">No sales recorded yet.</td>
        </tr>
        <tr th:each="r : ${receipts}">
            <td th:text="${r.receiptNumber}"></td>
            <td th:text="${r.location.locationName}"></td>
            <td th:text="${r.cashier.fullName}"></td>
            <td th:text="${r.createdAt}"></td>
            <td th:text="${'Rs. ' + r.totalAmount}"></td>
            <td th:text="${r.paymentMethod}"></td>
            <td th:text="${r.status}"></td>
            <td><a th:href="@{/sales/view/{id}(id=${r.id})}" class="btn btn-sm btn-info">View</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
