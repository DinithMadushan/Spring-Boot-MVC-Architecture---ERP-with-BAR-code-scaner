<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Sale - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2>New Sale</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-warning">
        No products exist yet. <a th:href="@{/products/new}">Add a product first</a>.
    </div>

    <form th:action="@{/sales/save}" method="post" class="mt-3" id="saleForm">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Location</label>
                <select name="locationId" class="form-select" required>
                    <option value="">-- Select Location --</option>
                    <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.locationName}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Payment Method</label>
                <select name="paymentMethod" class="form-select" required>
                    <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Discount (Rs.)</label>
                <input type="number" step="0.01" name="discount" class="form-control" value="0" min="0" />
            </div>
        </div>

        <h5>Items</h5>
        <table class="table table-bordered" id="itemsTable">
            <thead class="table-light">
            <tr><th>Product</th><th style="width:120px;">Quantity</th><th style="width:140px;">Unit Price</th><th style="width:60px;"></th></tr>
            </thead>
            <tbody id="itemsBody">
            <tr class="item-row">
                <td>
                    <select name="productIds" class="form-select product-select" required>
                        <option value="">-- Select Product --</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (' + p.barcode + ')'}"
                                th:data-price="${p.sellingPrice}"></option>
                    </select>
                </td>
                <td><input type="number" name="quantities" min="1" value="1" class="form-control" required /></td>
                <td><input type="number" step="0.01" name="unitPrices" min="0.01" class="form-control price-input" required /></td>
                <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger remove-row">&times;</button></td>
            </tr>
            </tbody>
        </table>
        <button type="button" id="addRowBtn" class="btn btn-outline-secondary btn-sm mb-3">+ Add Item</button>

        <div>
            <button type="submit" class="btn btn-primary">Complete Sale</button>
            <a th:href="@{/sales}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    // Auto-fill unit price from the product's selling price when chosen
    document.getElementById('itemsBody').addEventListener('change', function (e) {
        if (e.target.classList.contains('product-select')) {
            const selected = e.target.options[e.target.selectedIndex];
            const price = selected.getAttribute('data-price');
            const row = e.target.closest('tr');
            if (price) {
                row.querySelector('.price-input').value = price;
            }
        }
    });

    document.getElementById('addRowBtn').addEventListener('click', function () {
        const body = document.getElementById('itemsBody');
        const firstRow = body.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelectorAll('input').forEach(function (input) {
            input.value = input.type === 'number' && input.name === 'quantities' ? '1' : '';
        });
        newRow.querySelectorAll('select').forEach(function (select) { select.value = ''; });
        body.appendChild(newRow);
    });

    document.getElementById('itemsBody').addEventListener('click', function (e) {
        if (e.target.classList.contains('remove-row')) {
            const rows = document.querySelectorAll('.item-row');
            if (rows.length > 1) {
                e.target.closest('tr').remove();
            } else {
                alert('A sale needs at least one item.');
            }
        }
    });
</script>
</body>
</html>
