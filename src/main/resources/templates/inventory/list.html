<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2>Inventory / Stock</h2>
    <p class="text-muted">Stock on hand per product, per location. Updated automatically by GRNs (in) and Sales (out).</p>

    <form method="get" th:action="@{/inventory}" class="row g-2 mb-3">
        <div class="col-md-4">
            <select name="locationId" class="form-select" onchange="this.form.submit()">
                <option value="">All Locations</option>
                <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.locationName}"
                        th:selected="${selectedLocationId != null and selectedLocationId == loc.id}"></option>
            </select>
        </div>
    </form>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr><th>Product</th><th>Barcode</th><th>Location</th><th>Quantity On Hand</th><th>Last Updated</th></tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(inventory)}">
            <td colspan="5" class="text-center text-muted">No stock recorded yet. Receive goods via a GRN to populate inventory.</td>
        </tr>
        <tr th:each="inv : ${inventory}">
            <td th:text="${inv.product.name}"></td>
            <td th:text="${inv.product.barcode}"></td>
            <td th:text="${inv.location.locationName}"></td>
            <td>
                <span class="badge" th:classappend="${inv.quantityOnHand == 0} ? 'bg-danger' : (${inv.quantityOnHand < 10} ? 'bg-warning text-dark' : 'bg-success')"
                      th:text="${inv.quantityOnHand}"></span>
            </td>
            <td th:text="${inv.lastUpdated}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
