<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Order Details - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="'Purchase Order ' + ${po.poNumber}"></h2>
        <a th:href="@{/purchase-orders}" class="btn btn-secondary btn-sm">Back to list</a>
    </div>

    <div class="row mb-4">
        <div class="col-md-3"><strong>Supplier:</strong> <span th:text="${po.supplier.name}"></span></div>
        <div class="col-md-3"><strong>Order Date:</strong> <span th:text="${po.orderDate}"></span></div>
        <div class="col-md-3"><strong>Status:</strong> <span th:text="${po.status}"></span></div>
        <div class="col-md-3"><strong>Created By:</strong> <span th:text="${po.createdBy != null ? po.createdBy.fullName : '-'}"></span></div>
    </div>
    <div class="row mb-4">
        <div class="col-md-3"><strong>Approved By:</strong>
            <span th:text="${po.approvedBy != null ? po.approvedBy.fullName : 'Not yet approved'}"></span>
        </div>
    </div>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Product</th>
            <th>Ordered Qty</th>
            <th>Received Qty</th>
            <th>Remaining</th>
            <th>Unit Price</th>
            <th>Line Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${po.items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.orderedQuantity}"></td>
            <td th:text="${item.receivedQuantity}"></td>
            <td th:text="${item.remainingQuantity}"></td>
            <td th:text="${'Rs. ' + item.unitPrice}"></td>
            <td th:text="${'Rs. ' + item.lineTotal}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="5" class="text-end"><strong>Total</strong></td>
            <td><strong th:text="${'Rs. ' + po.totalAmount}"></strong></td>
        </tr>
        </tfoot>
    </table>

    <a th:if="${po.approvedBy == null}" th:href="@{/purchase-orders/approve/{id}(id=${po.id})}" class="btn btn-outline-success">Approve</a>
    <a th:if="${po.receivable}" th:href="@{/grn/new/{id}(id=${po.id})}" class="btn btn-primary">Receive Goods (Create GRN)</a>
</div>
</body>
</html>
