<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Orders - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Purchase Orders</h2>
        <a th:href="@{/purchase-orders/new}" class="btn btn-success">+ New Purchase Order</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>PO Number</th>
            <th>Supplier</th>
            <th>Order Date</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(purchaseOrders)}">
            <td colspan="6" class="text-center text-muted">No purchase orders yet.</td>
        </tr>
        <tr th:each="po : ${purchaseOrders}">
            <td th:text="${po.poNumber}"></td>
            <td th:text="${po.supplier.name}"></td>
            <td th:text="${po.orderDate}"></td>
            <td th:text="${'Rs. ' + po.totalAmount}"></td>
            <td>
                <span class="badge"
                      th:classappend="${po.status.name() == 'PENDING'} ? 'bg-secondary' :
                                      (${po.status.name() == 'PARTIALLY_RECEIVED'} ? 'bg-warning text-dark' :
                                      (${po.status.name() == 'RECEIVED'} ? 'bg-success' : 'bg-danger'))"
                      th:text="${po.status}"></span>
            </td>
            <td>
                <a th:href="@{/purchase-orders/view/{id}(id=${po.id})}" class="btn btn-sm btn-info">View</a>
                <a th:if="${po.editable}" th:href="@{/purchase-orders/edit/{id}(id=${po.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:if="${po.editable}" th:href="@{/purchase-orders/delete/{id}(id=${po.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this purchase order?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
