<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Goods Received Notes - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Goods Received Notes</h2>
        <a th:href="@{/grn/new}" class="btn btn-success">+ Receive Goods</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>GRN Number</th>
            <th>Purchase Order</th>
            <th>Supplier</th>
            <th>Received Date</th>
            <th>Received By</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(grns)}">
            <td colspan="6" class="text-center text-muted">No GRNs recorded yet.</td>
        </tr>
        <tr th:each="grn : ${grns}">
            <td th:text="${grn.grnNumber}"></td>
            <td th:text="${grn.purchaseOrder.poNumber}"></td>
            <td th:text="${grn.purchaseOrder.supplier.name}"></td>
            <td th:text="${grn.receivedDate}"></td>
            <td th:text="${grn.receivedBy}"></td>
            <td>
                <a th:href="@{/grn/view/{id}(id=${grn.id})}" class="btn btn-sm btn-info">View</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
