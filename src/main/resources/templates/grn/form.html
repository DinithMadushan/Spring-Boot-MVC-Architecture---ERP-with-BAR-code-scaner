<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receive Goods - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2 th:text="'Receive Goods — ' + ${po.poNumber}"></h2>
    <p class="text-muted" th:text="'Supplier: ' + ${po.supplier.name}"></p>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/grn/save}" method="post" class="mt-3">
        <input type="hidden" name="purchaseOrderId" th:value="${po.id}" />

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Received By</label>
                <input type="text" name="receivedBy" class="form-control" placeholder="Name of receiver" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Received Date</label>
                <input type="date" name="receivedDate" class="form-control" th:value="${today}" required />
            </div>
        </div>

        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>Product</th>
                <th>Ordered</th>
                <th>Already Received</th>
                <th>Remaining</th>
                <th style="width:160px;">Receive Now</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${po.items}" th:if="${item.remainingQuantity > 0}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.orderedQuantity}"></td>
                <td th:text="${item.receivedQuantity}"></td>
                <td th:text="${item.remainingQuantity}"></td>
                <td>
                    <input type="hidden" name="poItemIds" th:value="${item.id}" />
                    <input type="number" name="receivedQuantities" class="form-control"
                           min="0" th:max="${item.remainingQuantity}" value="0" />
                </td>
            </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Confirm Receipt</button>
        <a th:href="@{/purchase-orders/view/{id}(id=${po.id})}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
