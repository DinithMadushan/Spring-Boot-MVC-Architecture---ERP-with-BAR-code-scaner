<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receive Goods - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2>Receive Goods</h2>
    <p class="text-muted">Select a purchase order that still has goods outstanding.</p>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(purchaseOrders)}" class="alert alert-info">
        There are no purchase orders currently awaiting delivery.
        <a th:href="@{/purchase-orders/new}">Create one first</a>.
    </div>

    <table th:if="${!#lists.isEmpty(purchaseOrders)}" class="table table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>PO Number</th>
            <th>Supplier</th>
            <th>Order Date</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="po : ${purchaseOrders}">
            <td th:text="${po.poNumber}"></td>
            <td th:text="${po.supplier.name}"></td>
            <td th:text="${po.orderDate}"></td>
            <td th:text="${po.status}"></td>
            <td><a th:href="@{/grn/new/{id}(id=${po.id})}" class="btn btn-sm btn-primary">Receive</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
