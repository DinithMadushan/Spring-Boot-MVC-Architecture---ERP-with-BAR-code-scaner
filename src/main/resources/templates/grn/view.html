<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GRN Details - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="'GRN ' + ${grn.grnNumber}"></h2>
        <a th:href="@{/grn}" class="btn btn-secondary btn-sm">Back to list</a>
    </div>

    <div class="row mb-4">
        <div class="col-md-3"><strong>Purchase Order:</strong>
            <a th:href="@{/purchase-orders/view/{id}(id=${grn.purchaseOrder.id})}" th:text="${grn.purchaseOrder.poNumber}"></a>
        </div>
        <div class="col-md-3"><strong>Supplier:</strong> <span th:text="${grn.purchaseOrder.supplier.name}"></span></div>
        <div class="col-md-3"><strong>Received Date:</strong> <span th:text="${grn.receivedDate}"></span></div>
        <div class="col-md-3"><strong>Received By:</strong> <span th:text="${grn.receivedBy}"></span></div>
    </div>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Product</th>
            <th>Quantity Received (this GRN)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${grn.items}">
            <td th:text="${item.purchaseOrderItem.product.name}"></td>
            <td th:text="${item.receivedQuantity}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
