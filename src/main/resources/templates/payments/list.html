<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payments - Supermarket ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <h2>Payments</h2>
    <p class="text-muted">A payment is recorded automatically when a sale is completed.</p>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr><th>ID</th><th>Receipt #</th><th>Method</th><th>Amount</th><th>Paid At</th></tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="5" class="text-center text-muted">No payments recorded yet.</td>
        </tr>
        <tr th:each="p : ${payments}">
            <td th:text="${p.id}"></td>
            <td><a th:href="@{/sales/view/{id}(id=${p.invoice.id})}" th:text="${p.invoice.receiptNumber}"></a></td>
            <td th:text="${p.paymentMethod}"></td>
            <td th:text="${'Rs. ' + p.amount}"></td>
            <td th:text="${p.paidAt}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
